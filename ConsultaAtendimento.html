<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Paciente</title>
  <?!= include('Stylesheet'); ?>
</head>
<body>

  <?!= include('Nav', {baseUrl: baseUrl}); ?>

  <div class="page">
    <header class="page-header">
      <div class="header-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="30" height="30">
          <circle cx="20" cy="20" r="12" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M29 29 L40 40" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-text">
        <p class="eyebrow">Atenção Primária Itinerante</p>
        <h1>Buscar Paciente</h1>
        <p class="subtitle">Busque pelo número do atendimento e escolha quais categorias de dados exibir</p>
      </div>
    </header>

    <fieldset class="section">
      <legend><span class="section-index">🔍</span> Buscar por número</legend>

      <div class="search-bar">
        <div class="field">
          <label for="numero-busca">Número do atendimento</label>
          <input type="text" id="numero-busca" inputmode="numeric" placeholder="Digite o número e pressione Enter">
        </div>
        <button type="button" class="btn btn-primary" id="btn-buscar">Buscar</button>
      </div>

      <div class="field" style="margin-top: 18px;">
        <label>Quais dados buscar?</label>
        <div class="category-toggles" id="category-toggles">
          <input type="checkbox" class="category-toggle" id="cat-triagem" value="triagem" checked>
          <label class="category-toggle-label" for="cat-triagem"><span class="dot"></span>Triagem</label>

          <input type="checkbox" class="category-toggle" id="cat-exames" value="exames">
          <label class="category-toggle-label" for="cat-exames"><span class="dot"></span>Exames</label>

          <input type="checkbox" class="category-toggle" id="cat-anamnese" value="anamnese">
          <label class="category-toggle-label" for="cat-anamnese"><span class="dot"></span>Consulta</label>

          <input type="checkbox" class="category-toggle" id="cat-fisioterapia" value="fisioterapia">
          <label class="category-toggle-label" for="cat-fisioterapia"><span class="dot"></span>Fisioterapia</label>
        </div>
      </div>
    </fieldset>

    <div id="resultado-container"></div>

    <footer class="page-footer">Marque uma ou mais categorias acima para trazer, além da Triagem, os dados de Exames, Consulta (Anamnese) e/ou Fisioterapia do mesmo paciente.</footer>
  </div>

  <?!= include('JavaScriptConsulta'); ?>
</body>
</html>
