    // Destaca o link da página atual, lendo o parâmetro ?page= da URL

    var paginaAtual = params.get("page") || "inicio";
    document.querySelectorAll(".top-nav a[data-page]").forEach(function (link) {
      if (link.getAttribute("data-page") === paginaAtual) {
        link.classList.add("active");
      }
    });

    // proposital: navegar "no mesmo lugar" dentro do iframe interno do

    // página carrega como acesso direto, sem esse bloqueio.
  })();
</script>
